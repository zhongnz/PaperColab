name: LibrePaper cell compatibility
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LibrePaper/librepaper
          ref: c74c348d926d9b06f54da52ffb2ea18141267ba5
          path: build/upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --prefix build/deps --ignore-scripts --no-audit --no-fund loro-crdt@1.16.1
      - run: ln -s "$PWD/build/deps/node_modules" build/upstream/web/node_modules
      - run: echo "export {LoroDoc, LoroText} from 'loro-crdt'" > build/upstream/web/papercolab-loro.mjs
      - run: python3 scripts/package.py --zip build/input.zip
      - run: node experiments/librepaper/trial.mjs build/upstream build/input.zip build/edited.zip
      - run: npm ci --ignore-scripts
      - run: node_modules/.bin/esbuild experiments/librepaper/demo.mjs --bundle --format=esm --target=es2022 --outfile=build/cell-demo/app.js
      - run: cp build/deps/node_modules/loro-crdt/web/*.wasm build/cell-demo/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python experiments/librepaper/browser.py
      - run: docker pull texlive/texlive:TL2025-historic
      - run: python3 scripts/check_build.py --root estuary/main.tex --pdf build/edited.pdf build/edited.zip
      - name: Package the tested browser trial
        run: |
          mkdir -p build/trial/{experiments/librepaper,web/vendor,examples/estuary/sections,build/cell-demo,licences}
          cp experiments/librepaper/demo.html build/trial/experiments/librepaper/
          cp web/{blocks.js,editors.js,styles.css} build/trial/web/
          cp web/vendor/{engines.min.js,latex.min.js,editor-NOTICES.txt} build/trial/web/vendor/
          cp examples/estuary/sections/methods.tex build/trial/examples/estuary/sections/
          cp build/cell-demo/{app.js,*.wasm} build/trial/build/cell-demo/
          cp LICENSE build/trial/licences/PaperColab.txt
          cp build/upstream/LICENSE build/trial/licences/LibrePaper.txt
          cp build/deps/node_modules/loro-crdt/LICENSE* build/trial/licences/
          cp experiments/librepaper/START.txt build/trial/
          cd build/trial
          zip -qr ../PaperColab-LibrePaper-Cells.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PaperColab-LibrePaper-Cells
          path: build/PaperColab-LibrePaper-Cells.zip
