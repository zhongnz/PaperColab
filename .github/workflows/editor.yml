name: Verify manuscript editor
on: [pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:vendor
      - name: Confirm checked-in bundles and licence notices match the lockfile
        run: git diff --exit-code -- web/vendor
      - name: Install isolated collaboration trial dependencies
        run: npm install --prefix experiments/crdt --ignore-scripts --no-audit --no-fund
      - name: Compare CRDT source and checkpoint contracts
        run: npm test --prefix experiments/crdt
      - name: Exercise authenticated experimental checkpoint transport
        run: python3 experiments/crdt/transport_test.py
